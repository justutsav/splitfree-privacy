<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Reset your password — SplitFree</title>
<meta name="description" content="Set a new password for your SplitFree account." />
<style>
  :root {
    --bg: #fdfbf7;
    --fg: #1c1917;
    --muted: #6b6560;
    --plum: #78124e;
    --line: #e7e2da;
    --bad: #b3261e;
    --good: #146c43;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#121011; --fg:#f5f3f0; --muted:#a8a29e; --plum:#e879b9; --line:#2a2627; --bad:#f2b8b5; --good:#75d1a0; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 16px/1.65 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 26rem; margin: 0 auto; padding: 3rem 1.25rem 5rem; }
  .brand { display: flex; align-items: center; gap: .6rem; font-weight: 800; font-size: 1.15rem; letter-spacing: -0.02em; }
  .dot { width: .55rem; height: .55rem; border-radius: 999px; background: var(--plum); }
  h1 { font-size: 1.6rem; letter-spacing: -0.02em; margin: 1.75rem 0 .35rem; }
  p.sub { color: var(--muted); margin: 0 0 1.75rem; }
  label { display: block; font-weight: 600; font-size: .9rem; margin-bottom: .4rem; }
  input[type=password], input[type=text] {
    width: 100%; padding: .8rem .9rem; font-size: 1rem; color: var(--fg);
    background: transparent; border: 1px solid var(--line); border-radius: .75rem;
  }
  input:focus { outline: 2px solid var(--plum); outline-offset: 1px; }
  .row { display: flex; align-items: center; gap: .5rem; margin: .6rem 0 1.25rem; color: var(--muted); font-size: .9rem; }
  button {
    width: 100%; padding: .85rem 1rem; font-size: 1rem; font-weight: 600;
    color: #fff; background: var(--plum); border: 0; border-radius: 999px; cursor: pointer;
  }
  button[disabled] { opacity: .55; cursor: default; }
  .msg { margin-top: 1.1rem; font-size: .95rem; }
  .msg.bad { color: var(--bad); }
  .msg.good { color: var(--good); }
  .hidden { display: none; }
  footer { margin-top: 2.5rem; border-top: 1px solid var(--line); padding-top: 1.25rem; color: var(--muted); font-size: .85rem; }
  a { color: var(--plum); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="brand"><span class="dot"></span> SplitFree</div>

    <h1>Set a new password</h1>
    <p class="sub">Choose a new password for your account. Then open SplitFree and sign in with it.</p>

    <form id="form" class="hidden" autocomplete="on">
      <label for="pw">New password</label>
      <input id="pw" type="password" autocomplete="new-password" minlength="6" required
             placeholder="At least 6 characters" />
      <div class="row">
        <input id="show" type="checkbox" style="width:auto" />
        <label for="show" style="margin:0;font-weight:400">Show password</label>
      </div>
      <button id="submit" type="submit">Save password</button>
    </form>

    <div id="msg" class="msg"></div>

    <footer>
      Didn't ask for this? You can ignore this page — nothing changes until a new
      password is saved. &middot; <a href="/">Privacy policy</a>
    </footer>
  </div>

  <script src="/reset.js"></script>
</body>
</html>
